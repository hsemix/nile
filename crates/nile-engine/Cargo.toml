[package]
name = "nile-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["svg-text", "audio"]
# The OS clipboard (`arboard`). Off for embedders that supply their own clipboard.
system-clipboard = ["dep:arboard"]
# `<text>` in SVG (system fonts and shaping, about 0.7 MB of the binary). Without it SVG draws shapes only.
svg-text = ["nile-svg/text"]
# `Audio` and `<audio>`: MP3, WAV and FLAC (about 0.8 MB). `audio-vorbis` (+0.7 MB) and `audio-aac` (+0.25 MB) add Ogg Vorbis and AAC/M4A.
audio = ["nile-script/audio"]
audio-vorbis = ["nile-script/audio-vorbis"]
audio-aac = ["nile-script/audio-aac"]
# `fetch`/`XMLHttpRequest` over http(s) (`ureq`). Without it only files and `data:` URLs load.
net = ["dep:ureq", "nile-script/tls"]

[dependencies]
nile-dom.workspace = true
nile-style.workspace = true
nile-text.workspace = true
nile-layout.workspace = true
nile-render.workspace = true
nile-script.workspace = true
nile-canvas.workspace = true
nile-svg.workspace = true
skia-safe.workspace = true
arboard = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
nile-extensions = { path = "../nile-extensions" }
tempfile = "3"
serde_json = "1"
cc = "1"
