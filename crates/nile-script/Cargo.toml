[package]
name = "nile-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `wss://` (WebSocket over TLS) through `@sys`'s TCP sockets.
tls = ["dep:rustls", "dep:webpki-roots"]
# `Audio` and `<audio>` (nile-audio: the output device and the MP3/WAV/FLAC decoders, about 0.8 MB).
audio = ["dep:nile-audio"]
audio-vorbis = ["audio", "nile-audio/vorbis"]
audio-aac = ["audio", "nile-audio/aac"]
# The system credential store (Keychain, Credential Manager, the Secret Service): `@nile/keychain`.
keychain = ["dep:keyring"]

[dependencies]
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
nile-dom.workspace = true
nile-style.workspace = true
nile-canvas.workspace = true
nile-audio = { workspace = true, optional = true }
rquickjs.workspace = true
base64.workspace = true
ring.workspace = true

nile-extensions = { path = "../nile-extensions" }
serde_json = "1"

nile-extension-pack = { path = "../nile-extension-pack" }
keyring = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
cc = "1"
