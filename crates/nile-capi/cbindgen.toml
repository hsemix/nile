language = "C"
include_guard = "NILE_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true
usize_is_size_t = true
header = """/*
 * nile.h - C API of the Nile UI engine (generated by cbindgen from crates/nile-capi; do not edit).
 *
 * Nile renders HTML/CSS/JS into a pixel buffer you present however you like, and takes input
 * events from you. Everything is single-threaded: call it from one thread only.
 * Strings are UTF-8, NUL-terminated. Coordinates are logical (CSS) pixels unless stated.
 */"""

[export]
include = []

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
