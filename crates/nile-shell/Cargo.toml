[package]
name = "nile-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nile"
path = "src/main.rs"

[dependencies]
nile-dom.workspace = true
nile-style.workspace = true
nile-text.workspace = true
nile-layout.workspace = true
nile-render.workspace = true
nile-script.workspace = true
nile-engine = { workspace = true, features = ["system-clipboard", "net"] }
skia-safe.workspace = true
winit.workspace = true
softbuffer.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true

[dev-dependencies]
accesskit_consumer.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
