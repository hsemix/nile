[package]
name = "nile-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nile_shell"
path = "src/lib.rs"

[[bin]]
name = "nile"
path = "src/main.rs"

[dependencies]
nile-dom.workspace = true
nile-style.workspace = true
nile-text.workspace = true
nile-layout.workspace = true
nile-render.workspace = true
nile-script.workspace = true
nile-engine = { workspace = true, features = ["system-clipboard", "net"] }
skia-safe.workspace = true
winit.workspace = true
softbuffer.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
global-hotkey.workspace = true

nile-extension-pack = { path = "../nile-extension-pack" }
serde_json = "1"
ring.workspace = true
base64.workspace = true

[dev-dependencies]
nile-extensions = { path = "../nile-extensions" }
tempfile = "3"
cc = "1"
accesskit_consumer.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
