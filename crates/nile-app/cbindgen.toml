language = "C"
include_guard = "NILE_APP_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
includes = ["nile.h"]
no_includes = true
usize_is_size_t = true
header = """/*
 * nile_app.h - the standalone runner of libnile_app (generated by cbindgen from crates/nile-app; do not edit).
 *
 * libnile_app contains everything in nile.h plus these functions, which open windows and run the
 * event loop for you: link it instead of libnile when your program is a Nile application rather
 * than a host that draws into its own window. Include nile.h as well to use a view's functions.
 */"""

[export]
include = []

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
