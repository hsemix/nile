[package]
name = "nile-extension-pack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nile-dom.workspace = true
nile-extensions = { path = "../nile-extensions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
