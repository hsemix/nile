<!doctype html>
<html><head><title>Nile icon</title>
<style>
  html, body { margin: 0; background: transparent }
  /* 512 x 512 css px: render with --scale 2 for the 1024 px icon.png */
  .icon { position: relative; width: 464px; height: 464px; margin: 24px; border-radius: 104px; overflow: hidden;
    background: linear-gradient(160deg, #1f6fe0 0%, #0b3d91 55%, #072a66 100%); box-shadow: 0 10px 24px rgba(5, 25, 70, .45) }
  .sun { position: absolute; left: 318px; top: 50px; width: 84px; height: 84px; border-radius: 50%; background: #ffd166; opacity: .95 }
  .wave { position: absolute; left: -60px; width: 600px; height: 220px; border-radius: 50%; }
  .w1 { top: 318px; background: rgba(120, 190, 255, .35) }
  .w2 { top: 352px; background: rgba(160, 215, 255, .5) }
  .w3 { top: 392px; background: #e9f6ff }
  .n { position: absolute; left: 0; width: 464px; top: 86px; text-align: center; color: white; font: 700 250px/1 sans-serif; letter-spacing: -6px }
</style></head>
<body><div class="icon"><div class="sun"></div><div class="n">N</div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div></body></html>
