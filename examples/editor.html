<!doctype html>
<meta charset="utf-8" />
<title>Rich text editor</title>
<style>
  body {
    font-family: sans-serif;
    font-size: 15px;
    margin: 0;
    background: #eef0f4;
  }
  .bar {
    display: flex;
    gap: 4px;
    padding: 8px;
    background: #fff;
    border-bottom: 1px solid #d5d9e2;
  }
  .bar button {
    min-width: 30px;
    height: 28px;
    padding: 0 8px;
    background: #f4f5f8;
    border: 1px solid #d5d9e2;
    border-radius: 4px;
  }
  .bar button.on {
    background: #dbe3fa;
    border-color: #9fb3ee;
  }
  .page {
    width: 560px;
    margin: 16px auto;
    padding: 24px 32px;
    background: #fff;
    min-height: 260px;
    outline: none;
    border: 1px solid #d5d9e2;
  }
  .page p {
    margin: 0 0 10px;
  }
</style>
<div class="bar">
  <button data-cmd="bold"><b>B</b></button
  ><button data-cmd="italic"><i>I</i></button
  ><button data-cmd="underline"><u>U</u></button>
  <button data-cmd="strikeThrough"><s>S</s></button>
  <button data-cmd="justifyLeft">⇤</button
  ><button data-cmd="justifyCenter">↔</button
  ><button data-cmd="justifyRight">⇥</button>
  <button data-cmd="insertUnorderedList">• ≡</button
  ><button data-cmd="insertOrderedList">1 ≡</button>
  <button data-cmd="formatBlock" data-val="h2">H2</button
  ><button data-cmd="formatBlock" data-val="p">¶</button>
  <button data-cmd="foreColor" data-val="#c0392b">A</button>
  <button data-cmd="insertTable" data-val="3x3">▦</button>
  <button data-cmd="undo">↶</button><button data-cmd="redo">↷</button>
</div>
<div id="page" class="page" contenteditable="true">
  <h2 style="margin: 0 0 10px">Meeting notes</h2>
  <p>
    Click here and type. <b>Bold</b>, <i>italic</i> and plain text mix freely.
  </p>
  <p>Select a few words, then use the toolbar.</p>
  <ul>
    <li>First item</li>
    <li>Second item</li>
  </ul>
</div>
<script>
  const buttons = document.querySelectorAll("[data-cmd]");
  const refresh = () =>
    buttons.forEach((b) =>
      b.classList.toggle(
        "on",
        [
          "bold",
          "italic",
          "underline",
          "strikeThrough",
          "justifyLeft",
          "justifyCenter",
          "justifyRight",
          "insertUnorderedList",
          "insertOrderedList",
        ].includes(b.dataset.cmd) && document.queryCommandState(b.dataset.cmd),
      ),
    );
  buttons.forEach((b) =>
    b.addEventListener("mousedown", (e) => e.preventDefault()),
  );
  buttons.forEach((b) =>
    b.addEventListener("click", () => {
      document.execCommand(b.dataset.cmd, false, b.dataset.val);
      refresh();
    }),
  );
  document.addEventListener("selectionchange", refresh);
</script>
</html>
