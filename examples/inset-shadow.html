<!doctype html>
<meta charset="utf-8">
<title>inset shadows</title>
<style>
  body { margin: 20px; font: 12px sans-serif; background: #f4f1ea; display: flex; flex-wrap: wrap; gap: 20px }
  div { width: 130px; height: 80px; background: #fff; padding: 8px; box-sizing: border-box; border-radius: 10px }
  .a { box-shadow: inset 0 2px 8px rgba(0,0,0,.5) }
  .b { box-shadow: inset 0 0 0 4px #2a7fd4 }
  .c { box-shadow: inset 6px 6px 0 rgba(220,40,40,.6), 0 3px 8px rgba(0,0,0,.3) }
  .d { background: #dde; border: 3px solid #889; box-shadow: inset 0 0 20px #123 }
  input { box-shadow: inset 0 1px 3px rgba(0,0,0,.4); border-radius: 6px }
</style>
<div class="a">soft inner top</div><div class="b">ring</div><div class="c">offset + outer</div><div class="d">bordered, glow</div>
<input value="inset field">
