<!doctype html>
<html
  window-title="Neon Breaker · Nile Arcade"
  window-width="1180"
  window-height="900"
  window-min-width="800"
  window-min-height="620"
  window-frame="solid"
  window-frame-osx="native"
  window-resizable="6px"
>
  <head>
    <meta charset="utf-8" />
    <title>Neon Breaker · Nile Arcade</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header media="platform != 'OSX'">
      <div class="brand">N</div>
      <div class="caption" role="window-caption">
        NILE ARCADE <span>NEON BREAKER</span>
      </div>
      <button class="window" role="window-minimize" aria-label="Minimize">
        -</button
      ><button class="window" role="window-maximize" aria-label="Maximize">
        □</button
      ><button
        class="window close"
        role="window-close"
        aria-label="Close window"
      >
        x
      </button>
    </header>
    <main>
      <div class="game-heading">
        <div>
          <div class="eyebrow">A LITTLE FOCUS. A LOT OF MOMENTUM.</div>
          <h1>NEON<span>BREAKER</span><b>01—03</b></h1>
        </div>
        <div class="heading-controls">
          <button id="sound" title="Mute / unmute (M)">Sound on</button
          ><button id="settings" title="Sound and display settings">
            Settings</button
          ><button id="fullscreen" title="Toggle fullscreen (F)">
            Full screen
          </button>
        </div>
      </div>
      <div class="hud">
        <div><span>SCORE</span><strong id="score">000000</strong></div>
        <div><span>BEST</span><strong id="best">000000</strong></div>
        <div class="hud-sector">
          <span>SECTOR</span><strong id="sector">01 / 03</strong>
        </div>
        <div><span>ENERGY</span><strong id="lives">● ● ●</strong></div>
        <div class="hud-right">
          <span id="effect">READY TO LAUNCH</span
          ><button id="pause" disabled>Ⅱ Pause</button>
        </div>
      </div>
      <div id="arena-wrap">
        <div id="arena">
          <canvas
            id="game"
            width="960"
            height="600"
            tabindex="0"
            role="img"
            aria-label="Neon Breaker playfield. Move with mouse, arrow keys, or A and D. Space launches. Escape pauses."
          ></canvas>
          <div id="overlay" class="game-overlay"></div>
        </div>
      </div>
      <div class="game-footer">
        <span
          ><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> move
          <i>·</i> Mouse to steer <i>·</i> <kbd>SPACE</kbd> launch <i>·</i>
          <kbd>ESC</kbd> pause</span
        ><span id="frame-info">NILE / CANVAS 2D</span>
      </div>
      <div id="level-drop" class="level-drop">
        Drop a campaign .json here
        <button id="standard-levels">Standard campaign</button>
      </div>
      <div class="bottom-line">
        <span id="message" role="status" aria-live="polite"
          >Three sectors. One perfect run.</span
        ><span>LOCAL HIGH SCORE <span class="connection-dot"></span></span>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
