<!doctype html>
<html>
<head>
<style>
  body { margin: 0; padding: 20px; font-family: sans-serif; font-size: 13px; background: #f4f1ea }
  h2 { margin: 0 0 8px 0; font-size: 12px; color: #555 }
  .row { display: flex; gap: 16px; align-items: center; margin-bottom: 26px }
  .btn { padding: 8px 14px; background: #2a7; color: white; border-radius: 6px; width: 90px; text-align: center;
         transition: background-color 0.3s ease, transform 0.3s ease, border-radius 0.3s ease }
  .btn:hover { background: #37e; transform: scale(1.15) rotate(-3deg); border-radius: 18px }
  .bar { width: 120px; height: 12px; background: #ddd; border-radius: 6px; overflow: hidden }
  .bar > i { display: block; height: 100%; width: 20%; background: #e74; transition: width 1s linear }
  .bar:hover > i { width: 100% }
  .spin { width: 40px; height: 40px; background: #37e; border-radius: 6px; animation: spin 2s linear infinite }
  .pulse { width: 40px; height: 40px; background: #e74; border-radius: 20px; animation: pulse 1s ease-in-out infinite alternate }
  .slide { width: 40px; height: 40px; background: #2a7; animation: slide 2s steps(4) infinite }
  .fade { padding: 8px 14px; background: #eb2; animation: fade 1.5s ease-out both }
  @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes pulse { from { transform: scale(0.6); opacity: 0.5 } to { transform: scale(1.2); opacity: 1 } }
  @keyframes slide { 0% { margin-left: 0 } 100% { margin-left: 100px } }
  @keyframes fade { 0% { opacity: 0; transform: translateY(20px) } 100% { opacity: 1; transform: translateY(0) } }
</style>
</head>
<body>
  <h2>transition on hover (colour, transform, radius) and width</h2>
  <div class="row"><div class="btn">Hover me</div><div class="bar"><i></i></div></div>
  <h2>@keyframes: infinite spin, alternate pulse, steps(), fill both</h2>
  <div class="row"><div class="spin"></div><div class="pulse"></div><div class="slide"></div><div class="fade">fade in</div></div>
</body>
</html>
