<!doctype html>
<!-- `app-single-instance` makes a second launch hand its arguments to this window and exit.
     Try it: `nile examples/app-lifecycle.html -- one.txt`, then again with other arguments. -->
<html app-single-instance="nile.example.lifecycle">
<meta charset="utf-8"><title>app lifecycle</title>
<style>
body{margin:20px;font:14px sans-serif;width:560px}
h4{margin:16px 0 6px;color:#555}
button{padding:5px 12px;margin-right:6px}
#log{font:12px monospace;background:#f4f4f4;border-radius:4px;padding:8px;min-height:110px;white-space:pre-wrap}
.row{margin:6px 0}
</style>
<body>
<h3>App lifecycle</h3>
<div class="row">Started with <b id="args">…</b></div>
<h4>Events</h4>
<div id="log"></div>
<h4>Desktop integration</h4>
<div class="row"><label><input id="login" type="checkbox"> start at login</label></div>
<div class="row"><button id="proto">Handle nile-demo:// links</button><button id="ft">Handle .nile-demo files</button></div>
<div id="result" class="row"></div>
<script>
const $ = (s) => document.querySelector(s), log = (m) => { $('#log').textContent += m + '\n'; };
$('#args').textContent = JSON.stringify(application.arguments);
document.addEventListener('second-instance', (e) => log('second-instance  ' + JSON.stringify(e.arguments) + '  cwd=' + e.cwd));
document.addEventListener('open-url', (e) => log('open-url  ' + e.url));
document.addEventListener('open-file', (e) => log('open-file  ' + e.path));
$('#login').checked = application.loginItem;
$('#login').onchange = (e) => { application.loginItem = e.target.checked; $('#result').textContent = 'login item: ' + application.loginItem; };
$('#proto').onclick = () => { $('#result').textContent = 'registerProtocol: ' + application.registerProtocol('nile-demo') + ' (macOS: declare it with nile --pack --protocol)'; };
$('#ft').onclick = () => { $('#result').textContent = 'registerFileType: ' + application.registerFileType('nile-demo'); };
</script>
</body>
</html>
