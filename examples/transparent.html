<html window-frame="transparent" window-width="420" window-height="260" window-alignment="5">
  <head>
    <title>Transparent window</title>
    <style>
      html { background: transparent; }
      body { margin: 0; font: 14px sans-serif; }
      .card {
        margin: 24px; padding: 20px; height: 150px;
        border-radius: 18px;
        background: rgba(30, 40, 60, 0.78);
        color: #fff;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      }
      h3 { margin: 0 0 8px; }
      button { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="card" role="window-caption">
      <h3>Transparent window</h3>
      <div>The desktop shows through the corners and the translucent card.</div>
      <button role="window-close">Close</button>
    </div>
  </body>
</html>
