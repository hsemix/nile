<!doctype html>
<html>
<head>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 13px; background: #f4f1ea }
  h2 { margin: 14px 0 6px 0; font-size: 13px; color: #555 }
  .cell { background: #2a7; color: white; padding: 6px; border-radius: 4px }
  .cell:nth-child(2n) { background: #37e }
  .cell:nth-child(3n) { background: #e74 }
  .a { display: grid; grid-template-columns: 80px 1fr 2fr; gap: 6px 10px }
  .b { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(30px, auto); gap: 6px }
  .b .wide { grid-column: span 2 }
  .b .tall { grid-row: 1 / span 2; grid-column: 3 }
  .c { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px }
  .layout { display: grid; grid-template-columns: 90px 1fr; grid-template-rows: 30px 70px 28px; gap: 6px;
            grid-template-areas: "head head" "side main" "foot foot" }
  .layout > .head { grid-area: head } .layout > .side { grid-area: side }
  .layout > .main { grid-area: main } .layout > .foot { grid-area: foot }
  .d { display: grid; grid-template-columns: 120px 120px; grid-template-rows: 50px; justify-items: center; align-items: end; gap: 6px }
  .d .cell { width: 60px }
  .flex { display: flex; height: 50px; gap: 6px; background: #fff }
  .flex .cell { align-self: center }
  .flex .cell:last-child { align-self: stretch }
</style>
</head>
<body>
  <h2>columns: 80px 1fr 2fr, gap 6px 10px</h2>
  <div class="a"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
  <h2>repeat(3, 1fr), span and placement</h2>
  <div class="b"><div class="cell wide">span 2</div><div class="cell tall">tall</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div></div>
  <h2>auto-fill, minmax(90px, 1fr)</h2>
  <div class="c"><div class="cell">a</div><div class="cell">b</div><div class="cell">c</div><div class="cell">d</div><div class="cell">e</div><div class="cell">f</div><div class="cell">g</div></div>
  <h2>template areas</h2>
  <div class="layout"><div class="cell main">main</div><div class="cell foot">footer</div><div class="cell head">header</div><div class="cell side">side</div></div>
  <h2>justify-items center, align-items end</h2>
  <div class="d"><div class="cell">x</div><div class="cell">y</div></div>
  <h2>flex align-self</h2>
  <div class="flex"><div class="cell">center</div><div class="cell">stretch</div></div>
</body>
</html>
