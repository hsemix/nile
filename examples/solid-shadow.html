<html window-frame="solid-with-shadow" window-width="420" window-height="220" window-alignment="5">
  <head>
    <title>Solid with shadow</title>
    <style>
      body { margin: 0; font: 14px sans-serif; background: #fff; height: 100%; }
      .bar { padding: 10px 14px; background: #2d3340; color: #fff; }
      .body { padding: 14px; }
    </style>
  </head>
  <body>
    <div class="bar" role="window-caption">solid-with-shadow: drag here</div>
    <div class="body">
      No system frame, but the system draws the window's drop shadow
      (macOS and Windows; <code>solid</code> has none).
      <p><button role="window-close">Close</button></p>
    </div>
  </body>
</html>
