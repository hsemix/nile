<!doctype html>
<html>
<head>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 13px; background: #fff }
  .box { width: 300px; border: 1px solid #ccc; padding: 8px; margin-bottom: 14px }
  .l { float: left; width: 60px; height: 50px; background: #2a7; margin: 0 8px 4px 0 }
  .r { float: right; width: 50px; height: 40px; background: #37e; margin: 0 0 4px 8px }
  .clear { clear: both; background: #eee }
  .chip { float: left; padding: 3px 10px; margin-right: 6px; background: #e74; color: white; border-radius: 10px }
</style>
</head>
<body>
  <div class="box"><div class="l"></div><div class="r"></div>Text flows around floated boxes on both sides and continues below them once they end, just as in a browser page.<div class="clear">cleared</div></div>
  <div class="box"><span class="chip">one</span><span class="chip">two</span><span class="chip">three</span><div class="clear">after chips</div></div>
</body>
</html>
