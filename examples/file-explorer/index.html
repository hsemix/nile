<!doctype html>
<html>
  <head>
    <title>Files — Nile</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px sans-serif;
        color: #26344b;
        background: #f6f8fc;
      }
      body {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        box-sizing: border-box;
      }
      button {
        border: 0;
        background: transparent;
        color: inherit;
        padding: 9px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #e5ebf5;
      }
      button:disabled {
        color: #a9b2c0;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        background: #fff;
        border-bottom: 1px solid #dde4ef;
      }
      .brand {
        background: #3764df;
        color: white;
        padding: 8px 11px;
        border-radius: 8px;
        font-weight: bold;
      }
      h1 {
        font-size: 19px;
        margin: 0;
      }
      .muted {
        color: #78859a;
        font-size: 12px;
      }
      #search {
        margin-left: auto;
        width: 225px;
      }
      input {
        background: #f5f7fb;
        border: 1px solid #dce3ee;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 9px 16px;
        border-bottom: 1px solid #dde4ef;
      }
      #path {
        flex: 1;
        min-width: 0;
      }
      .primary {
        background: #e3ebff;
        color: #315bcc;
      }
      frameset {
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
        overflow: hidden;
      }
      .sidebar {
        padding: 20px 12px;
        overflow: auto;
      }
      .label {
        font-size: 11px;
        font-weight: bold;
        color: #8793a5;
        letter-spacing: 1px;
        margin: 8px 10px 12px;
      }
      #tree button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px;
        white-space: nowrap;
      }
      #tree .active {
        color: #315bcc;
        background: #e3ebff;
      }
      .main {
        background: white;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .heading {
        padding: 23px 22px 17px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      h2 {
        font-size: 23px;
        margin: 0;
      }
      #folder-count {
        margin-left: auto;
      }
      .columns,
      .row {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 100px 90px 120px;
        gap: 8px;
        align-items: center;
        padding: 0 20px;
      }
      .columns {
        background: #f8faff;
        border-top: 1px solid #edf0f5;
        border-bottom: 1px solid #edf0f5;
      }
      .columns button {
        text-align: left;
        font-size: 12px;
        color: #718099;
        padding: 11px 0;
      }
      #list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        outline: none;
      }
      .row {
        min-height: 49px;
        border-bottom: 1px solid #f0f3f8;
        cursor: pointer;
      }
      .row:hover {
        background: #f6f8fc;
      }
      .row.selected {
        background: #eaf0ff;
        color: #274fad;
      }
      .filename {
        display: flex;
        gap: 12px;
        align-items: center;
        overflow: hidden;
      }
      .filename span:last-child {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .icon {
        background: #edf1f9;
        color: #6f82a5;
        border-radius: 6px;
        padding: 6px;
        min-width: 19px;
        text-align: center;
      }
      .icon {
        width: 16px;
        height: 21px;
        padding: 0;
        min-width: 0;
        background: white;
        border: 2px solid #a5b5d2;
        border-radius: 3px;
      }
      .folder {
        width: 22px;
        height: 16px;
        border: 0;
        border-top: 5px solid #f0c86e;
        background: #f8dda1;
        border-radius: 3px;
      }
      .cell {
        font-size: 12px;
        color: #78859a;
      }
      .inspector {
        padding: 24px 20px;
        overflow: auto;
        background: #fafbfe;
      }
      #preview-icon {
        font-size: 22px;
        color: #6384de;
        margin: 12px 0 20px;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 8px;
        overflow-wrap: break-word;
      }
      .detail {
        margin: 18px 0;
        font-size: 12px;
        color: #7c899c;
      }
      .detail b {
        display: block;
        color: #33435b;
        margin-top: 6px;
        font-weight: normal;
      }
      pre {
        font: 12px monospace;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        background: white;
        border: 1px solid #e2e7f0;
        border-radius: 8px;
        padding: 12px;
        line-height: 1.6;
      }
      footer {
        display: flex;
        padding: 9px 20px;
        font-size: 12px;
        color: #75839a;
        border-top: 1px solid #dde4ef;
        background: white;
      }
      #status {
        flex: 1;
      }
      .empty {
        padding: 35px;
        color: #8793a5;
      }
      popup {
        background: white;
        border: 1px solid #dce3ee;
        border-radius: 8px;
        padding: 5px;
        width: 200px;
      }
      popup button {
        display: block;
        width: 100%;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">N</div>
      <div>
        <h1>Files</h1>
        <span class="muted">A place for everything.</span>
      </div>
      <input
        id="search"
        placeholder="Filter this folder"
        aria-label="Filter this folder"
      />
    </header>
    <div class="toolbar">
      <button id="back" title="Back">←</button
      ><button id="forward" title="Forward">→</button
      ><button id="up" title="Parent folder">↑</button
      ><input id="path" aria-label="Folder path" /><button
        id="refresh"
        title="Refresh"
      >
        Refresh</button
      ><button id="choose" class="primary">Open folder…</button
      ><button id="hidden">Hidden files</button>
    </div>
    <frameset cols="210px,*,275px"
      ><aside class="sidebar">
        <div class="label">WORKSPACE</div>
        <div id="tree"></div>
        <div class="label">NAVIGATION</div>
        <div class="muted" style="padding: 0 10px; line-height: 1.8">
          Double-click a folder to open it.<br />Drag the dividers to resize.<br />Enter
          opens · Backspace goes up.
        </div>
      </aside>
      <splitter />
      <section class="main">
        <div class="heading">
          <h2 id="folder-name">Workspace</h2>
          <span id="folder-count" class="muted"></span>
        </div>
        <div class="columns">
          <button data-sort="name">Name ↕</button
          ><button data-sort="type">Kind ↕</button
          ><button data-sort="size">Size ↕</button
          ><button data-sort="modified">Modified ↕</button>
        </div>
        <div id="list" tabindex="0" role="listbox" aria-label="Files"></div>
      </section>
      <splitter />
      <aside class="inspector">
        <div class="label">DETAILS</div>
        <div id="preview-icon">FILE</div>
        <h3 id="item-name">Select a file</h3>
        <div id="details" class="muted">
          Browse your workspace and preview text files.
        </div>
        <pre id="preview" style="display: none"></pre></aside
    ></frameset>
    <footer>
      <span id="status">Ready</span><span>Nile / File explorer</span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
