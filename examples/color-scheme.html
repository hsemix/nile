<!doctype html>
<html><head><meta charset="utf-8"><title>color-scheme per element</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui; margin: 0; padding: 20px; background: Canvas; color: CanvasText; }
  h3 { margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; gap: 14px; margin-top: 14px; }
  .box { flex: 1; padding: 14px; border: 1px solid GrayText; border-radius: 8px; background: Canvas; color: CanvasText; }
  .box p { margin: 0 0 10px; }
  .box > * + * { margin-top: 8px; display: block; }
  .light { color-scheme: light; }
  .dark { color-scheme: dark; }
  .system { color-scheme: light dark; }
</style></head>
<body>
  <h3>color-scheme on elements (the page follows the system)</h3>
  <div class="row">
    <div class="box light"><p>color-scheme: light</p><button>Button</button><input value="Text field"><input type="checkbox" checked> <select><option>Select</option></select></div>
    <div class="box dark"><p>color-scheme: dark</p><button>Button</button><input value="Text field"><input type="checkbox" checked> <select><option>Select</option></select></div>
    <div class="box system"><p>color-scheme: light dark</p><button>Button</button><input value="Text field"><input type="checkbox" checked> <select><option>Select</option></select></div>
  </div>
  <script>
    const m = matchMedia('(prefers-color-scheme: dark)');
    const say = () => { document.querySelector('h3').textContent = 'color-scheme on elements — system is ' + (m.matches ? 'dark' : 'light'); };
    m.addEventListener('change', say); say();
  </script>
</body></html>
