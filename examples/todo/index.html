<!doctype html>
<html>
<head>
  <title>nile — todo (modules + JSX)</title>
  <style>
    body { margin: 0; padding: 24px; font-family: sans-serif; color: #1f2933; background: #f4f1ea }
    h1 { font-size: 22px; margin: 0 0 12px 0 }
    #app { width: 340px }
    ul { margin: 0 0 12px 0; padding: 0 }
    li.todo { display: flex; gap: 10px; padding: 8px 12px; background: #ffffff; border: 1px solid #d6d3cb; margin-bottom: -1px }
    li.todo:hover { background: #f0fdf4 }
    li.todo.done .label { color: #9ca3af; text-decoration: line-through }
    .box { width: 16px; height: 16px; border: 2px solid #14532d; border-radius: 4px; color: #14532d; font-size: 12px }
    .row { display: flex; justify-content: space-between; align-items: center }
    #add { padding: 8px 16px; background: #14532d; color: #fefce8; border-radius: 8px }
    #add:hover { background: #166534 }
    #count { color: #6b7280 }
  </style>
</head>
<body>
  <div id="app">
    <h1>Todo</h1>
    <ul id="list"></ul>
    <div class="row"><div id="add">Add task</div><div id="count"></div></div>
  </div>
  <script type="module" src="app.jsx"></script>
</body>
</html>
