<html><head><title>Flip card</title>
<style>
  body { font: 15px sans-serif; margin: 30px; background: #eef1f6 }
  .card { width: 220px; height: 140px; perspective: 600px; display: inline-block; margin-right: 24px }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.4s }
  .card:hover .inner { transform: rotateY(180deg) }
  .face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff }
  .front { background: #2f80ed }
  .back { background: #27ae60; transform: rotateY(180deg) }
  .face button { margin-left: 10px }
</style></head><body>
<p>Hover a card to turn it over. Only the side facing you is drawn and clicked.</p>
<div class="card"><div class="inner"><div class="face front">Front</div><div class="face back">Back <button onclick="document.title='clicked back'">Go</button></div></div></div>
<div class="card"><div class="inner" style="transform: rotateY(180deg)"><div class="face front">Front</div><div class="face back">Back (already turned)</div></div></div>
</body></html>
