[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nile-dom = { path = "crates/nile-dom" }
nile-style = { path = "crates/nile-style" }
nile-text = { path = "crates/nile-text" }
nile-layout = { path = "crates/nile-layout" }
nile-render = { path = "crates/nile-render" }
nile-script = { path = "crates/nile-script" }
nile-engine = { path = "crates/nile-engine" }
nile-capi = { path = "crates/nile-capi" }

html5ever = "0.39"
miniz_oxide = "0.9.1"
markup5ever_rcdom = "0.39"
cssparser = "0.38"
selectors = "0.41"
precomputed-hash = "0.1"
taffy = "0.14"
parley = "0.12"
skia-safe = "0.93"
rquickjs = { version = "0.14", features = ["loader"] }
winit = "0.30"
softbuffer = "0.4"
accesskit = "0.25"
windows-sys = { version = "0.52", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
accesskit_winit = "0.34"
accesskit_consumer = "0.39"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSMenu", "NSMenuItem", "NSApplication", "NSEvent", "NSCell", "NSControl"] }
arboard = { version = "3.6", default-features = false }
imagesize = "0.13"
base64 = "0.22"
ureq = "3.4.2"

# Debug builds run the whole engine unoptimised, which makes scrolling and hover visibly lag
# (a wheel tick on the Word example took ~16 ms, with spikes of ~40 ms). Optimise the
# dependencies fully (Taffy, Parley, QuickJS, ...) and our own crates lightly, keeping debug info
# and fast incremental builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
