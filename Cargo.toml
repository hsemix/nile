[workspace]
resolver = "2"
members = ["crates/*", "extensions/sqlite", "extensions/notifications"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nile-audio = { path = "crates/nile-audio" }
# Playback only (no recording, no dither); the decoders are features of nile-audio.
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
nile-dom = { path = "crates/nile-dom" }
nile-style = { path = "crates/nile-style" }
nile-text = { path = "crates/nile-text" }
nile-layout = { path = "crates/nile-layout" }
nile-render = { path = "crates/nile-render" }
nile-canvas = { path = "crates/nile-canvas" }
nile-svg = { path = "crates/nile-svg", default-features = false }
nile-script = { path = "crates/nile-script" }
nile-engine = { path = "crates/nile-engine" }
nile-capi = { path = "crates/nile-capi" }
nile-shell = { path = "crates/nile-shell" }

html5ever = "0.39"
miniz_oxide = "0.9.1"
markup5ever_rcdom = "0.39"
cssparser = "0.38"
selectors = "0.41"
precomputed-hash = "0.1"
taffy = "0.14"
parley = "0.12"
wuff = "0.2.9"
skia-safe = "0.93"
rquickjs = { version = "0.14", features = ["loader"] }
winit = "0.30"
# Pinned master: 0.4.8 has no alpha modes (transparent windows); switch back once 0.5 is released.
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "9a7c9caf4ac29a8ae361d68c9a5babb97e36dc70" }
accesskit = "0.25"
windows-sys = { version = "0.52", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Registry"] }
accesskit_winit = "0.34"
accesskit_consumer = "0.39"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSMenu", "NSMenuItem", "NSApplication", "NSEvent", "NSCell", "NSControl", "NSVisualEffectView", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
arboard = { version = "3.6", default-features = false }
imagesize = "0.13"
base64 = "0.22"
# Ed25519 and SHA-256 for update signatures (already linked by rustls).
ring = "0.17"
ureq = "3.4.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# Debug builds run the whole engine unoptimised, which makes scrolling and hover visibly lag
# (a wheel tick on the Word example took ~16 ms, with spikes of ~40 ms). Optimise the
# dependencies fully (Taffy, Parley, QuickJS, ...) and our own crates lightly, keeping debug info
# and fast incremental builds.
[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"


[profile.test]
debug = 1
incremental = false

# Native extensions must unwind so their `guard` can turn a panic into a status code; the engine
# itself doesn't (unwinding costs ~1.2 MB of binary). Build extensions with `--profile extension`.
[profile.extension]
inherits = "release"
panic = "unwind"
