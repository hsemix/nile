name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev
      - name: Fetch extension dependencies
        run: cargo fetch --locked
      - name: Extension tooling UTF-8 regression tests
        run: cargo test -p nile-extensions --examples
      - name: Build SQLite independently against the public SDK
        run: cargo run -p nile-extensions --example check-extension-standalone
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The compiler's errors as one annotation (the raw log needs admin rights to download).
            summary=$(grep -E "^(error|warning)" -A6 clippy.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Clippy on ${{ matrix.os }}::${summary}"
          fi
          exit $status
      - name: Workspace tests including packed native executable execution
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Failing test names and panics as one annotation (readable without the raw log).
            summary=$(grep -E "^test .* FAILED|panicked at|^---- |left:|right:|error(\[|:)" test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests on ${{ matrix.os }}::${summary}"
          fi
          exit $status
