name: Release builds

# Builds the `nile` shell, the `libnile` C library (include/nile.h; embedding only) and `libnile_app` (the same plus a standalone runner, include/nile_app.h) for Windows, Linux and
# macOS. It runs on every push to main (the archives are kept as workflow artifacts for 30 days),
# by hand from the Actions tab, and when a tag such as v0.1.0 is pushed, which also attaches them to
# a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --release --target ${{ matrix.target }} -p nile-shell -p nile-capi -p nile-app 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "^(error|warning)" -A6 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build on ${{ matrix.name }}::${summary}"
          fi
          exit $status
      - name: Package
        shell: bash
        run: |
          out=nile-${{ matrix.name }}
          mkdir "$out"
          dir=target/${{ matrix.target }}/release
          case "${{ runner.os }}" in
            Windows)
              cp "$dir/nile.exe" "$dir/nile.dll" "$dir/nile.dll.lib" "$dir/nile.lib" "$out/" 2>/dev/null || cp "$dir/nile.exe" "$dir/nile.dll" "$out/"
              cp "$dir/nile_app.dll" "$dir/nile_app.dll.lib" "$dir/nile_app.lib" "$out/" 2>/dev/null || cp "$dir/nile_app.dll" "$out/" ;;
            macOS)   cp "$dir/nile" "$dir/libnile.dylib" "$dir/libnile.a" "$dir/libnile_app.dylib" "$dir/libnile_app.a" "$out/" ;;
            Linux)   cp "$dir/nile" "$dir/libnile.so" "$dir/libnile.a" "$dir/libnile_app.so" "$dir/libnile_app.a" "$out/" ;;
          esac
          cp crates/nile-capi/include/nile.h crates/nile-app/include/nile_app.h "$out/"
          cp crates/nile-capi/include/nile.h LICENSE* README.md "$out/" 2>/dev/null || cp crates/nile-capi/include/nile.h README.md "$out/"
          cp assets/icon.png "$out/nile.png"
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ runner.os }}" = Windows ]; then
            # Nile's icon and version details inside the executable (Explorer's Properties > Details).
            "$dir/nile.exe" --brand "$dir/nile.exe" -o "$out/nile-branded.exe" --icon assets/icon.png --name Nile --version "$ver" \
              --description "Nile UI engine" --company "Nile contributors" --copyright "Nile contributors" \
              && mv -f "$out/nile-branded.exe" "$out/nile.exe" || echo "::warning::could not add the icon to nile.exe"
          fi
          if [ "${{ runner.os }}" = Linux ]; then
            printf '[Desktop Entry]\nType=Application\nName=Nile\nComment=Nile UI engine\nExec=nile\nIcon=nile\nTerminal=false\nCategories=Development;\n' > "$out/nile.desktop"
          fi
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$out.zip" "$out"; else tar czf "$out.tar.gz" "$out"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nile-${{ matrix.name }}
          path: nile-${{ matrix.name }}.*
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nile-${{ matrix.name }}.*
