name: Release builds

# Builds the `nile` shell and the `libnile` C library (with include/nile.h) for Windows, Linux and
# macOS. Run it by hand from the Actions tab, or push a tag such as v0.1.0 to attach the archives
# to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --release --target ${{ matrix.target }} -p nile-shell -p nile-capi 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "^(error|warning)" -A6 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build on ${{ matrix.name }}::${summary}"
          fi
          exit $status
      - name: Package
        shell: bash
        run: |
          out=nile-${{ matrix.name }}
          mkdir "$out"
          dir=target/${{ matrix.target }}/release
          case "${{ runner.os }}" in
            Windows) cp "$dir/nile.exe" "$dir/nile.dll" "$dir/nile.dll.lib" "$dir/nile.lib" "$out/" 2>/dev/null || cp "$dir/nile.exe" "$dir/nile.dll" "$out/" ;;
            macOS)   cp "$dir/nile" "$dir/libnile.dylib" "$dir/libnile.a" "$out/" ;;
            Linux)   cp "$dir/nile" "$dir/libnile.so" "$dir/libnile.a" "$out/" ;;
          esac
          cp crates/nile-capi/include/nile.h LICENSE* README.md "$out/" 2>/dev/null || cp crates/nile-capi/include/nile.h README.md "$out/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$out.zip" "$out"; else tar czf "$out.tar.gz" "$out"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nile-${{ matrix.name }}
          path: nile-${{ matrix.name }}.*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nile-${{ matrix.name }}.*
